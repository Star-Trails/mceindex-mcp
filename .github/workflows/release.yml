name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    name: Build and Release Binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - os: windows
            arch: amd64
            ext: .exe
          - os: windows
            arch: arm64
            ext: .exe
          - os: linux
            arch: amd64
            ext: ""
          - os: linux
            arch: arm64
            ext: ""
          - os: darwin
            arch: amd64
            ext: ""
          - os: darwin
            arch: arm64
            ext: ""
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.27.x'
          check-latest: true

      - name: Build Binary
        env:
          CGO_ENABLED: 0
          GOOS: ${{ matrix.os }}
          GOARCH: ${{ matrix.arch }}
        run: |
          OUTPUT_NAME="mceindex-mcp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}"
          go build -trimpath -ldflags="-s -w" -o "${OUTPUT_NAME}" ./cmd/mceindex-mcp
          sha256sum "${OUTPUT_NAME}" > "${OUTPUT_NAME}.sha256"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: |
            mceindex-mcp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}
            mceindex-mcp-${{ matrix.os }}-${{ matrix.arch }}${{ matrix.ext }}.sha256
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
