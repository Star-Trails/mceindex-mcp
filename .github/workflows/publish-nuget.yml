name: Publish NuGet

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

concurrency:
  group: nuget-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    environment: release

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore MceIndex.slnx

      - name: Test
        run: dotnet test MceIndex.slnx --configuration Release --no-restore

      - name: Pack
        run: >-
          dotnet pack src/MceIndex.Mcp/MceIndex.Mcp.csproj
          --configuration Release
          --no-restore
          --output artifacts
          -p:ContinuousIntegrationBuild=true

      - name: Exchange GitHub OIDC token for NuGet credentials
        id: login
        uses: NuGet/login@v1
        with:
          user: ${{ vars.NUGET_USER }}

      - name: Publish to NuGet.org
        run: >-
          dotnet nuget push "artifacts/*.nupkg"
          --api-key "${{ steps.login.outputs.NUGET_API_KEY }}"
          --source https://api.nuget.org/v3/index.json
          --skip-duplicate
